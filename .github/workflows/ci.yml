name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Setup minimum supported Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.45

      - name: Verify launcher IPC on minimum Bun
        run: bun scripts/launcher-ipc-smoke.ts dist/worker/launcher.js
